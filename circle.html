<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root {
  color-scheme: dark;
  --bg: #091315;
  --surface: #101d20;
  --surface-2: #16272b;
  --line: #213539;
  --line-strong: #2f4a4f;
  --text: #f4fbfb;
  --muted: #9db3b7;
  --accent: #2dd4bf;
  --accent-2: #22d3ee;
  --accent-ink: #04211e;
  --green: #34d399;
  --orange: #fb923c;
  --red: #f87171;
  --slate: #a3b4c2;
  --radius: 10px;
  --sans: 'Schibsted Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 400 15px/1.5 var(--sans);
  min-height: 100vh;
}
/* The "circle": faint concentric rings behind the page. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    repeating-radial-gradient(circle at 100% 100%, transparent 0 58px, rgba(45,212,191,.045) 58px 59px),
    radial-gradient(circle at 100% 0, rgba(34,211,238,.07), transparent 42%);
}
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.mono { font-family: var(--mono); font-feature-settings: 'tnum'; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
[hidden] { display: none !important; }

/* Shell */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 28px;
  padding: 24px 14px 18px;
  background: rgba(13,25,28,.92);
  border-right: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; text-decoration: none; }
.brand-ring { width: 30px; height: 30px; border-radius: 50%; border: 5px solid var(--accent); box-shadow: 0 0 0 1px rgba(45,212,191,.25), 0 0 18px rgba(45,212,191,.28); flex: none; }
.brand-name { display: block; font-weight: 700; font-size: 15.5px; letter-spacing: -.01em; line-height: 1.15; }
.brand-sub { display: block; font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav a, .nav button {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 9px 10px; border: 0; border-radius: 8px;
  background: none; color: var(--muted); text-decoration: none; text-align: left;
  font-weight: 500; cursor: pointer; white-space: nowrap;
}
.nav svg { width: 17px; height: 17px; flex: none; }
.nav a:hover, .nav button:hover { background: var(--surface-2); color: var(--text); }
.nav a[aria-current="page"] { background: rgba(45,212,191,.12); color: var(--accent); }
.sidebar-foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; }
.main { padding: 34px 38px 60px; max-width: 1240px; width: 100%; min-width: 0; }
.main:focus { outline: none; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 24px; }
.page-title { font-size: 28px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; }
.page-sub { color: var(--muted); margin-top: 3px; }

/* Buttons and form controls */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-strong);
  background: var(--surface-2); color: var(--text); font-weight: 600; font-size: 14px;
  cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .55; cursor: wait; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: #5eead4; border-color: #5eead4; }
.btn-danger { background: none; border-color: rgba(248,113,113,.5); color: var(--red); }
.btn-danger:hover { border-color: var(--red); background: rgba(248,113,113,.1); }
.btn-sm { padding: 4px 10px; font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field > .label { font-size: 13px; font-weight: 600; color: var(--muted); }
.req { color: var(--accent); }
.input, select.input, textarea.input {
  width: 100%; padding: 9px 11px; border-radius: 8px;
  background: #0c181a; border: 1px solid var(--line-strong); color: var(--text);
}
.input::placeholder { color: #7d9498; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(45,212,191,.18); }
textarea.input { resize: vertical; min-height: 70px; }
input[type="date"] { color-scheme: dark; font-family: var(--mono); font-size: 14px; }
.hint { font-size: 12px; color: var(--muted); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.form-error { color: var(--red); font-size: 14px; font-weight: 500; }

/* Panels and tiles */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.panel-title { font-size: 16px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 14px; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px 17px; animation: rise .35s ease both; }
.tile:nth-child(2) { animation-delay: .05s; } .tile:nth-child(3) { animation-delay: .1s; }
.tile:nth-child(4) { animation-delay: .15s; } .tile:nth-child(5) { animation-delay: .2s; }
.tile-label { font-size: 13px; color: var(--muted); font-weight: 500; }
.tile-value { font-family: var(--mono); font-size: 36px; font-weight: 500; line-height: 1.2; margin-top: 6px; letter-spacing: -.03em; }
.tile.lead { border-color: rgba(45,212,191,.45); background: linear-gradient(150deg, rgba(45,212,191,.13), var(--surface) 65%); }
.tile.lead .tile-value { color: var(--accent); }
.tile.warn .tile-value { color: var(--orange); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }

/* Tables */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.toolbar .search { flex: 1 1 260px; }
.toolbar select { flex: 0 1 170px; width: auto; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.panel .table-wrap { background: none; border: 0; border-radius: 0; margin: 0 -20px -8px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 11px 14px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tr.row-link { cursor: pointer; }
tr.row-link:hover td { background: var(--surface-2); }
.td-name a { font-weight: 600; text-decoration: none; }
.td-name a:hover { color: var(--accent); }
.nowrap { white-space: nowrap; }
.members-table th, .members-table td { padding-left: 10px; padding-right: 10px; }
.actions { display: flex; gap: 6px; }
.chip {
  display: inline-block; padding: 2px 8px; border-radius: 6px;
  font: 600 12.5px/1.45 var(--mono); letter-spacing: .03em; white-space: nowrap;
  color: var(--accent); background: rgba(45,212,191,.1); border: 1px solid rgba(45,212,191,.42);
}
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 8px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, currentColor 13%, transparent); }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.active { color: var(--green); } .badge.expiring { color: var(--orange); }
.badge.expired { color: var(--red); } .badge.paused { color: var(--slate); }
.empty { padding: 34px 16px; text-align: center; color: var(--muted); }
.list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; }
.list-row:first-child { border-top: 0; padding-top: 0; }
.list-row:last-child { padding-bottom: 0; }
a.list-row:hover .list-name { color: var(--accent); }
.list-name { font-weight: 600; }
.list-main { min-width: 0; }

/* Profile */
.back { display: inline-block; color: var(--muted); text-decoration: none; font-size: 14px; margin-bottom: 14px; }
.back:hover { color: var(--accent); }
.member-card {
  position: relative; overflow: hidden; border-radius: 14px; padding: 24px 26px; margin-bottom: 18px;
  border: 1px solid rgba(45,212,191,.38);
  background: linear-gradient(120deg, #123036, #0f2024 62%);
}
.member-card::after {
  content: ''; position: absolute; right: -90px; top: -110px; width: 320px; height: 320px; border-radius: 50%; pointer-events: none;
  background: repeating-radial-gradient(circle, transparent 0 21px, rgba(45,212,191,.13) 21px 22px);
}
.member-card > * { position: relative; z-index: 1; }
.mc-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; align-items: flex-start; }
.mc-name { font-size: 30px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; overflow-wrap: anywhere; }
.mc-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 9px; }
.mc-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.mc-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 22px; margin-top: 22px; }
.fact-label { font-size: 12px; color: var(--muted); font-weight: 500; }
.fact-value { font-weight: 500; overflow-wrap: anywhere; }
.fact-value a { text-decoration: none; } .fact-value a:hover { color: var(--accent); }
.term { margin-top: 20px; }
.term-labels { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }

/* Service tracker */
.tracker { display: grid; gap: 15px; }
.tr-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 3px 14px; margin-bottom: 6px; }
.tr-name { font-weight: 600; }
.tr-count { font-size: 13px; color: var(--muted); white-space: nowrap; }
.tr-item.full .tr-count { color: var(--red); font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: #0a1517; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.bar-fill { height: 100%; min-width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.tr-item.full .bar-fill { background: var(--red); }
.bar.unlimited { background: repeating-linear-gradient(115deg, rgba(45,212,191,.2) 0 6px, transparent 6px 12px); box-shadow: inset 0 0 0 1px var(--line); }
.perk { display: flex; gap: 9px; align-items: center; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.perk b { color: var(--accent); font-weight: 600; }

/* Service log form */
.log-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 18px; align-items: start; }
.log-form { display: grid; gap: 14px; }
.combo { position: relative; }
.combo-list {
  position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; max-height: 280px; overflow-y: auto;
  margin: 0; padding: 4px; list-style: none; background: var(--surface-2);
  border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 14px 30px rgba(0,0,0,.45);
}
.combo-opt { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 6px; cursor: pointer; }
.combo-opt[aria-selected="true"], .combo-opt:hover { background: rgba(45,212,191,.14); }
.combo-empty { padding: 9px; color: var(--muted); font-size: 14px; }
.picked { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 11px; border-radius: 8px; border: 1px solid rgba(45,212,191,.42); background: rgba(45,212,191,.07); }
.picked-who { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; min-width: 0; }
.notice { padding: 9px 12px; border-radius: 8px; font-size: 14px; color: var(--orange); background: rgba(251,146,60,.09); border: 1px solid rgba(251,146,60,.35); }

/* Analytics bars */
.hbars { display: grid; gap: 13px; }
.hbar-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 14px; }
.hbar-val { font-family: var(--mono); font-weight: 500; }

/* Dialogs and toast */
dialog { padding: 0; width: min(580px, calc(100vw - 32px)); max-height: calc(100vh - 40px); background: var(--surface); color: var(--text); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: 0 24px 70px rgba(0,0,0,.6); }
dialog::backdrop { background: rgba(3,9,10,.72); }
dialog.narrow { width: min(430px, calc(100vw - 32px)); }
.dlg-body { padding: 22px; }
.dlg-title { font-size: 20px; font-weight: 700; letter-spacing: -.015em; margin-bottom: 4px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.toast { position: fixed; z-index: 100; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 8px; background: #0f2c2b; border: 1px solid var(--accent); font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.toast.error { background: #321719; border-color: var(--red); }
.setup ol { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 7px; }
code { font-family: var(--mono); font-size: 13px; color: var(--accent); }

@media (max-width: 1180px) {
  .shell { display: block; }
  .sidebar { position: sticky; z-index: 30; height: auto; gap: 10px; padding: 12px 16px 8px; border-right: 0; border-bottom: 1px solid var(--line); background: #0d191c; }
  .nav { flex-direction: row; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
  .nav a, .nav button { width: auto; padding: 7px 10px; font-size: 14px; }
  .nav svg { display: none; }
  .sidebar-foot { display: none; }
  .main { max-width: none; padding: 26px 24px 50px; }
}
@media (max-width: 900px) {
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .log-layout, .two-col { grid-template-columns: minmax(0, 1fr); }
  .members-table { min-width: 860px; }
}
@media (max-width: 640px) {
  .main { padding: 22px 16px 48px; }
  .page-title { font-size: 24px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile-value { font-size: 30px; }
  .tile.lead { grid-column: 1 / -1; }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .member-card { padding: 20px 18px; }
  .mc-name { font-size: 25px; }
  .toolbar select { flex: 1 1 130px; }
}
</style>
</head>

<script>

/* ─── Config ─────────────────────────────────────────────────── */
const SUPABASE_URL = 'https://urwdtonvkibmeixzzmkj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_AGJiteLf_-qcK-uimPF-Ew_pUnp4i_A';

/* service_log.service always stores `name`; `label` only changes how it reads on a plan.
   total: null means unlimited. */
const PLANS = {

};
const EXPIRING_DAYS = 30;

const configured = !SUPABASE_URL.startsWith('YOUR_') && !SUPABASE_ANON_KEY.startsWith('YOUR_');

};
const view = document.getElementById('view');

/* ─── Helpers ────────────────────────────────────────────────── */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const newId = () => crypto.randomUUID();
const digits = s => String(s ?? '').replace(/\D/g, '');

// Dates are 'YYYY-MM-DD' strings in local (Karachi) time, never via toISOString, which is UTC.
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parts(s) { const [y, m, d] = String(s).split('-').map(Number); return { y, m, d }; }
function addMonths(s, n) {
  const { y, m, d } = parts(s);
  const idx = y * 12 + (m - 1) + n;
  const ny = Math.floor(idx / 12), nm = idx % 12 + 1;
  const lastDay = new Date(Date.UTC(ny, nm, 0)).getUTCDate();
  return `${ny}-${pad(nm)}-${pad(Math.min(d, lastDay))}`;
}
function daysBetween(a, b) {
  const p = parts(a), q = parts(b);
  return Math.round((Date.UTC(q.y, q.m - 1, q.d) - Date.UTC(p.y, p.m - 1, p.d)) / 86400000);
}
const daysUntil = s => daysBetween(todayStr(), s);
function fmtDate(s) {
  if (!s) return '—';
  const { y, m, d } = parts(s);
  if (!y || !m || !d) return esc(s);
  return `${pad(d)} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m - 1]} ${y}`;
}
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

function displayStatus(m) {
  if (m.status === 'paused') return 'paused';
  if (m.status === 'expired') return 'expired';
  if (!m.end_date) return 'active';
  const left = daysUntil(m.end_date);
  if (left < 0) return 'expired';
  return left <= EXPIRING_DAYS ? 'expiring' : 'active';
}
const planOf = m => PLANS[m.plan] || PLANS['6month'];
const planLabel = m => planOf(m).label;
const cardNum = m => { const x = /^RC-(\d+)$/.exec(m.card_number || ''); return x ? Number(x[1]) : 0; };
const nextCardNumber = () => `RC-${String(state.members.reduce((max, m) => Math.max(max, cardNum(m)), 0) + 1).padStart(3, '0')}`;
const getMember = id => state.members.find(m => m.id === id);
const logsFor = id => state.logs.filter(l => l.member_id === id);
const byDateDesc = (a, b) => String(b.date || '').localeCompare(String(a.date || ''));

function tracker(m) {
  const logs = logsFor(m.id);
  return planOf(m).services.map(s => ({
    ...s,
    label: s.label || s.name,
    used: logs.filter(l => l.service === s.name).length,
  }));
}
const chip = m => `<span class="chip">${esc(m.card_number || '—')}</span>`;
const badge = m => { const s = displayStatus(m); return `<span class="badge ${s}">${STATUS_LABEL[s]}</span>`; };
const expiringSoon = () => state.members
  .filter(m => displayStatus(m) === 'expiring')
  .sort((a, b) => a.end_date.localeCompare(b.end_date));

let toastTimer;
function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, isError ? 6000 : 3000);
}

/* ─── Data ───────────────────────────────────────────────────── */
async function fetchAll(table) {
  // Supabase returns at most 1000 rows per request, so read page by page.
  const size = 1000; let rows = [], from = 0;
  for (;;) {
    const { data, error } = await db.from(table).select('*').order('id').range(from, from + size - 1);
    if (error) throw error;
    rows = rows.concat(data);
    if (data.length < size) return rows;
    from += size;
  }
}
async function loadAll() {
  const [members, logs] = await Promise.all([fetchAll('members'), fetchAll('service_log')]);
  state.members = members.sort((a, b) => cardNum(a) - cardNum(b));
  state.logs = logs;
  state.loaded = true;
  state.loadError = null;
}
async function refresh() {
  try { await loadAll(); } catch (e) { state.loadError = e; }
  onDataChange();
}
function onDataChange() {
  // Keep a half-filled service log form intact when data reloads.
  if (route().page === 'log' && state.loaded && !state.loadError && document.getElementById('logForm')) renderLogDynamic();
  else render();
}

function route() {
  const [page, id] = location.hash.replace(/^#\/?/, '').split('/');
  return { page: page || 'home', id: id ? decodeURIComponent(id) : null };
}
function render() {
  const { page, id } = route();
  const active = page === 'member' ? 'members' : page;
  document.querySelectorAll('[data-nav]').forEach(a => {
    if (a.dataset.nav === active) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (!configured) return renderSetup();
  if (state.loadError) return renderLoadError();
  if (!state.loaded) { view.innerHTML = '<div class="empty">Loading members…</div>'; return; }
  const pages = { home: renderHome, members: renderMembers, member: () => renderProfile(id), log: () => renderLog(id), analytics: renderAnalytics };
  (pages[page] || renderHome)();
}

async function saveMember(existing) {
  const $ = i => document.getElementById(i);
  const fail = msg => { $('mError').textContent = msg; $('mError').hidden = false; };
  $('mError').hidden = true;
  const v = {
    name: $('mName').value.trim(), phone: $('mPhone').value.trim(), email: $('mEmail').value.trim(),
    plan: $('mPlan').value, start_date: $('mStart').value, end_date: $('mEnd').value, notes: $('mNotes').value.trim(),
  };
  if (!v.name) return fail('Enter the member\'s name.');
  if (!v.phone) return fail('Enter a phone number.');
  if (!$('mEmail').checkValidity()) return fail('That email address doesn\'t look right.');
  if (!v.start_date || !v.end_date) return fail('Enter both a start date and an end date.');
  if (v.end_date <= v.start_date) return fail('The end date must be after the start date.');
  $('mSave').disabled = true;
  try {
    let savedId;
    if (existing) {
      v.status = $('mStatus').value;
      const { error } = await db.from('members').update(v).eq('id', existing.id);
      if (error) throw error;
      savedId = existing.id;
    } else {
      savedId = newId();
      // Read the latest cards before issuing one; retry if someone else just took that number.
      for (let attempt = 0; ; attempt++) {
        await loadAll();
        const { error } = await db.from('members').insert({ ...v, id: savedId, card_number: nextCardNumber(), status: 'active', created_at: new Date().toISOString() });
        if (!error) break;
        if (error.code !== '23505' || attempt >= 4) throw error;
      }
    }
    await loadAll();
    memberDialog.close();
    toast(existing ? 'Member updated.' : `Added ${v.name} as ${getMember(savedId)?.card_number}.`);
    if (existing) onDataChange(); else location.hash = `#/member/${encodeURIComponent(savedId)}`;
  } catch (e) {
    fail(`Couldn't save: ${e.message || 'unknown error'}. Nothing was changed.`);
    $('mSave').disabled = false;
  }
}

function confirmDialog({ title, body, confirmLabel }) {
  return new Promise(resolve => {
    confirmDialogEl.innerHTML = `<div class="dlg-body">
      <h2 class="dlg-title" id="confirmTitle">${esc(title)}</h2>
      <p class="muted">${esc(body)}</p>
      <div class="dlg-foot"><button type="button" class="btn" id="confirmNo" autofocus>Cancel</button><button type="button" class="btn btn-danger" id="confirmYes">${esc(confirmLabel)}</button></div>
    </div>`;
    let settled = false;
    const finish = answer => {
      if (settled) return;
      settled = true;
      confirmDialogEl.removeEventListener('cancel', onEsc);
      confirmDialogEl.close();
      resolve(answer);
    };
    const onEsc = () => finish(false);
    confirmDialogEl.addEventListener('cancel', onEsc);
    document.getElementById('confirmNo').addEventListener('click', () => finish(false));
    document.getElementById('confirmYes').addEventListener('click', () => finish(true));
    confirmDialogEl.showModal();
  });
}
async function deleteMember(id) {

    confirmLabel: 'Delete member',
  });
  if (!ok) return;
  const { error } = await db.from('members').delete().eq('id', id);
  if (error) return toast(`Couldn't delete: ${error.message}`, true);
  toast(`${m.name} deleted.`);
  await loadAll().catch(e => { state.loadError = e; });
  location.hash = '#/members';
}
async function deleteLog(id) {
  const l = state.logs.find(x => x.id === id); if (!l) return;
  const ok = await confirmDialog({
    title: 'Delete this entry?',
    body: `${(l.service)} on ${fmtDate(l.date)} will be removed and the session returned to the member's allowance.`,
    confirmLabel: 'Delete entry',
  });
  if (!ok) return;
  const { error } = await db.from('service_log').delete().eq('id', id);
  if (error) return toast(`Couldn't delete: ${error.message}`, true);
  toast('Entry deleted.');
  await refresh();
}

/* ─── Service log ────────────────────────────────────────────── */
function storedLoggedBy() { try { return localStorage.getItem('cp_logged_by') || ''; } catch { return ''; } }
function rememberLoggedBy(v) { try { localStorage.setItem('cp_logged_by', v); } catch { /* optional convenience */ } }

function renderLog(presetId) {
  document.title = 'Service Log — Circle';
  state.logMemberId = presetId && getMember(presetId) ? presetId : null;
  view.innerHTML = `
  <div class="page-head"><div><h1 class="page-title">Service Log</h1><p class="page-sub">Record a service a member has used.</p></div></div>
  <div class="log-layout">
    <section class="panel">
      <form class="log-form" id="logForm" novalidate>
        <div class="field">
          <label for="logSearch" id="logMemberLabel">Member <span class="req">*</span></label>
          <div id="logPicker"></div>
        </div>
        <div class="field"><label for="logService">Service <span class="req">*</span></label><select class="input" id="logService"></select></div>
        <div class="form-grid">
          <div class="field"><label for="logDate">Date <span class="req">*</span></label><input class="input" id="logDate" type="date" max="${todayStr()}" value="${todayStr()}"></div>
          <div class="field"><label for="logBy">Logged by <span class="req">*</span></label><input class="input" id="logBy" autocomplete="off" value="${esc(storedLoggedBy())}"></div>
        </div>
        <div class="field"><label for="logNotes">Notes</label><textarea class="input" id="logNotes"></textarea></div>
        <div class="notice" id="logNotice" hidden></div>
        <p class="form-error" id="logError" role="alert" hidden></p>
        <div><button class="btn btn-primary" id="logSave" type="submit">Save entry</button></div>
      </form>
    </section>
    <div style="display:grid;gap:18px;min-width:0" id="logSide"></div>
  </div>`;
  document.getElementById('logForm').addEventListener('submit', e => { e.preventDefault(); saveLog(); });
  document.getElementById('logDate').addEventListener('change', updateLogNotice);
  renderLogDynamic();
}
function renderLogDynamic() {
  renderLogPicker();
  renderServiceOptions();
  updateLogNotice();
  const m = getMember(state.logMemberId);
  const recent = [...(m ? logsFor(m.id) : state.logs)].sort(byDateDesc).slice(0, 12);
  document.getElementById('logSide').innerHTML = `
    ${m ? `<section class="panel"><h2 class="panel-title">${esc(m.name)}: remaining services</h2>${trackerHtml(m)}</section>` : ''}
    <section class="panel"><h2 class="panel-title">${m ? 'Their recent entries' : 'Recent entries'}</h2>${recent.length ? logTable(recent, !m) : '<p class="muted">Nothing logged yet.</p>'}</section>`;
}
function renderLogPicker() {
  const box = document.getElementById('logPicker');
  const m = getMember(state.logMemberId);
  if (m) {
    box.innerHTML = `<div class="picked"><span class="picked-who">${chip(m)} <strong>${esc(m.name)}</strong> <span class="muted small">${planLabel(m)}</span> ${badge(m)}</span><button type="button" class="btn btn-sm" data-action="change-log-member">Change</button></div>`;
    return;
  }
  if (document.getElementById('logSearch')) return; // keep what's being typed
  box.innerHTML = `<div class="combo"><input class="input" id="logSearch" role="combobox" aria-expanded="false" aria-controls="logResults" aria-autocomplete="list" autocomplete="off" placeholder="Search by name or card number">
    <ul class="combo-list" id="logResults" role="listbox" aria-labelledby="logMemberLabel" hidden></ul></div>`;
  const input = document.getElementById('logSearch'), list = document.getElementById('logResults');
  let results = [], active = -1;
  const paint = () => {
    list.hidden = !input.value.trim();
    input.setAttribute('aria-expanded', String(!list.hidden));
    list.innerHTML = results.length ? results.map((r, i) => `<li class="combo-opt" role="option" id="opt-${i}" data-pick="${esc(r.id)}" aria-selected="${i === active}">${chip(r)} <span>${esc(r.name)}</span> <span class="muted small" style="margin-left:auto">${planLabel(r)}</span></li>`).join('')
      : '<li class="combo-empty">No matching members.</li>';
    if (active >= 0) { input.setAttribute('aria-activedescendant', `opt-${active}`); document.getElementById(`opt-${active}`).scrollIntoView({ block: 'nearest' }); }
    else input.removeAttribute('aria-activedescendant');
  };
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    results = q ? state.members.filter(x => (x.name || '').toLowerCase().includes(q) || (x.card_number || '').toLowerCase().includes(q)).slice(0, 8) : [];
    active = results.length ? 0 : -1;
    paint();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && results.length) { e.preventDefault(); active = (active + 1) % results.length; paint(); }
    else if (e.key === 'ArrowUp' && results.length) { e.preventDefault(); active = (active - 1 + results.length) % results.length; paint(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (results[active]) pickLogMember(results[active].id); }
    else if (e.key === 'Escape') { list.hidden = true; input.setAttribute('aria-expanded', 'false'); }
  });
  input.addEventListener('blur', () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); });
  list.addEventListener('mousedown', e => {
    const opt = e.target.closest('[data-pick]');
    e.preventDefault(); // keep focus until the pick is handled
    if (opt) pickLogMember(opt.dataset.pick);
  });
}
function pickLogMember(id) {
  state.logMemberId = id;
  renderLogDynamic();
  document.getElementById('logService').focus();
}
function renderServiceOptions() {
  const sel = document.getElementById('logService'), prev = sel.value;
  const m = getMember(state.logMemberId);
  sel.disabled = !m;
  if (!m) { sel.innerHTML = '<option value="">Choose a member first</option>'; return; }
  sel.innerHTML = '<option value="">Select a service…</option>' + tracker(m).map(s => {
    const full = s.total !== null && s.used >= s.total;
    const note = s.total === null ? 'unlimited' : full ? 'fully used' : `${s.total - s.used} left`;
    return `<option value="${esc(s.name)}" ${full ? 'disabled' : ''}>${esc(s.label)} (${note})</option>`;
  }).join('');
  const prevOpt = [...sel.options].find(o => o.value === prev && !o.disabled);
  if (prevOpt) sel.value = prev;
}
function updateLogNotice() {
  const n = document.getElementById('logNotice');
  const m = getMember(state.logMemberId), date = document.getElementById('logDate').value;
  let msg = '';
  if (m) {
    if (displayStatus(m) === 'paused') msg = `${m.name}'s membership is paused.`;
    else if (m.status === 'expired') msg = `${m.name}'s membership is marked as expired.`;
    else if (date && ((m.start_date && date < m.start_date) || (m.end_date && date > m.end_date))) {
      msg = `This date is outside the membership term (${fmtDate(m.start_date)} to ${fmtDate(m.end_date)}).`;
    }
  }
  n.textContent = msg ? `${msg} You can still save this entry.` : '';
  n.hidden = !msg;
}
async function saveLog() {
  const $ = i => document.getElementById(i);
  const fail = msg => { $('logError').textContent = msg; $('logError').hidden = false; };
  $('logError').hidden = true;
  const m = getMember(state.logMemberId);
  const service = $('logService').value, date = $('logDate').value, by = $('logBy').value.trim(), notes = $('logNotes').value.trim();
  if (!m) return fail('Choose a member.');
  if (!service) return fail('Choose a service.');
  if (!date) return fail('Enter the date.');
  if (date > todayStr()) return fail('The date can\'t be in the future.');
  if (!by) return fail('Enter who is logging this.');
  $('logSave').disabled = true;
  const { error } = await db.from('service_log').insert({ id: newId(), member_id: m.id, service, date, notes, logged_by: by });
  $('logSave').disabled = false;
  if (error) return fail(`Couldn't save: ${error.message}. The entry was not recorded.`);
  rememberLoggedBy(by);
  $('logService').value = '';
  $('logNotes').value = '';
  toast(`Logged ${(service)} for ${m.name}.`);
  await refresh();
}

/* ─── Analytics ──────────────────────────────────────────────── */
function renderAnalytics() {
  document.title = 'Analytics — Circle';
  const counts = {}, perMember = {};
  state.logs.forEach(l => {
    counts[l.service] = (counts[l.service] || 0) + 1;
    perMember[l.member_id] = (perMember[l.member_id] || 0) + 1;
  });
  const services = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const maxS = services.length ? services[0][1] : 1;
  const top = Object.entries(perMember).map(([id, n]) => ({ m: getMember(id), n })).filter(x => x.m).sort((a, b) => b.n - a.n).slice(0, 10);
  const exp = expiringSoon();
  view.innerHTML = `
  <div class="page-head"><div><h1 class="page-title">Analytics</h1><p class="page-sub">${plural(state.logs.length, 'service')} logged across ${plural(state.members.length, 'member')}.</p></div></div>
  <div class="two-col">
    <section class="panel" style="grid-row:span 2"><h2 class="panel-title">Services used</h2>
      ${services.length ? `<div class="hbars">${services.map(([name, n]) => `<div><div class="hbar-head"><span>${esc((name))}</span><span class="hbar-val">${n}</span></div><div class="bar" aria-hidden="true"><div class="bar-fill" style="width:${n / maxS * 100}%"></div></div></div>`).join('')}</div>` : '<p class="muted">No services logged yet.</p>'}
    </section>
    <section class="panel"><h2 class="panel-title">Most active members</h2>
      ${top.length ? top.map(({ m, n }) => `<a class="list-row" href="#/member/${encodeURIComponent(m.id)}"><span class="list-main"><span class="list-name">${esc(m.name)}</span> ${chip(m)}</span><span class="mono small nowrap">${plural(n, 'service')}</span></a>`).join('') : '<p class="muted">No activity yet.</p>'}
    </section>
    <section class="panel"><h2 class="panel-title">Expiring soon <span class="muted small" style="font-weight:500">(next ${EXPIRING_DAYS} days)</span></h2>${expiringList(exp)}</section>
  </div>`;
}

/* ─── Global clicks ──────────────────────────────────────────── */
const actions = {
  'add-member': () => openMemberForm(null),
  'edit-member': el => openMemberForm(el.dataset.id),
  'close-member': () => memberDialog.close(),
  'delete-member': el => deleteMember(el.dataset.id),
  'delete-log': el => deleteLog(el.dataset.id),
  'change-log-member': () => {
    state.logMemberId = null;
    document.getElementById('logPicker').innerHTML = '';
    renderLogDynamic();
    document.getElementById('logSearch').focus();
  },
  refresh: async el => {
    if (!configured) return;
    el.disabled = true;
    await refresh();
    el.disabled = false;
    if (!state.loadError) toast('Data refreshed.');
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el) { actions[el.dataset.action](el); return; }
  if (e.target.closest('a, button')) return;
  const row = e.target.closest('tr[data-member]');
  if (row) location.hash = `#/member/${encodeURIComponent(row.dataset.member)}`;
});

/* ─── Start ──────────────────────────────────────────────────── */
render();
if (configured) refresh();
</script>
</body>
</html>
